name: Website

# Builds www/ (Astro) and deploys it to Cloudflare Workers (static assets).
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
# plus Zone DNS/Workers Routes: Edit for zalthar.com); the account and custom
# domain come from www/wrangler.jsonc. Without the secret the deploy is skipped.
on:
  push:
    branches: [main]
    paths: ["www/**", "Cargo.toml", ".github/workflows/www.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: www
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: www
          command: deploy
