name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs on the dedicated AWS Lightsail runner.
  linux:
    name: test (AWS linux)
    runs-on: [self-hosted, Linux, X64, nyq-aws]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/../nyq-ci-target
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
