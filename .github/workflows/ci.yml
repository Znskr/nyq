name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs on the self-hosted machine (label nyq-linux): no GitHub minutes.
  linux:
    name: test (self-hosted linux)
    runs-on: [self-hosted, nyq-linux]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../nyq-ci-target
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
