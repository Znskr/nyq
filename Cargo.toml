[package]
name = "nyq"
version = "0.4.21"
edition = "2021"
description = "A small, friendly coding-agent CLI"
license = "Apache-2.0"

[features]
default = ["tls-rustls"]
# Pure-Rust TLS on ring: no system TLS library, identical behaviour everywhere.
tls-rustls = ["dep:rustls", "reqwest/rustls-no-provider"]
# Platform TLS (Security.framework on macOS, OpenSSL on Linux): smaller binary,
# but adds an OpenSSL build/runtime dependency on Linux.
tls-native = ["reqwest/native-tls"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Distribution build: same code, platform TLS instead of rustls/ring.
# Build with `cargo build --profile lean --no-default-features --features tls-native`.
[profile.lean]
inherits = "release"

[dependencies]
agent-client-protocol = "3.1"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
dirs = "6"
eventsource-stream = "0.2"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
nu-ansi-term = "0.50"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
similar = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
